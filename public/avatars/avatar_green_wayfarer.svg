<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        93%, 97% { transform: scaleY(0.1); }
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-8px) rotate(-1deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(-5px) rotate(1deg); }
      }
      
      @keyframes eyebrowRaise {
        0%, 85%, 100% { transform: translateY(0); }
        88%, 92% { transform: translateY(-4px); }
      }
      
      @keyframes subtleGlow {
        0%, 100% { filter: drop-shadow(0 0 0px rgba(34, 197, 94, 0)); }
        50% { filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.3)); }
      }
      
      .eye {
        animation: blink 5s infinite;
      }
      
      .character {
        animation: bounce 3s ease-in-out infinite, subtleGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      
      .eyebrow {
        transform-origin: center;
        animation: eyebrowRaise 7s infinite;
      }
    </style>
  </defs>

  <!-- Character Group with bounce animation -->
  <g class="character">
    <!-- Main Head Circle -->
    <circle cx="256" cy="256" r="180" fill="#22C55E"/>
    
    <!-- Head Outline -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#3D3D3D" stroke-width="8"/>

    <!-- WAYFARER STYLE GLASSES (Thick black frames) -->
    <g stroke="#3D3D3D" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Lens Frame (thick trapezoid shape) -->
      <path d="M 145 230 L 225 230 L 230 285 L 140 285 Z" fill="none" stroke-width="12"/>
      
      <!-- Right Lens Frame (thick trapezoid shape) -->
      <path d="M 287 230 L 367 230 L 372 285 L 282 285 Z" fill="none" stroke-width="12"/>
      
      <!-- Bridge (thick) -->
      <rect x="230" y="250" width="52" height="12" fill="#3D3D3D" rx="2"/>
      
      <!-- Left Temple Arm (thick) -->
      <path d="M 145 245 L 85 238" stroke-width="12"/>
      
      <!-- Right Temple Arm (thick) -->
      <path d="M 367 245 L 427 238" stroke-width="12"/>
    </g>

    <!-- EYEBROWS GROUP -->
    <g class="eyebrow" fill="none" stroke="#3D3D3D" stroke-width="6" stroke-linecap="round">
      <!-- Left Eyebrow -->
      <path d="M 145 195 Q 185 190 220 195"/>
      
      <!-- Right Eyebrow -->
      <path d="M 292 195 Q 327 190 367 195"/>
    </g>

    <!-- EYES GROUP -->
    <g fill="#3D3D3D">
      <!-- Left Eye -->
      <ellipse class="eye" cx="185" cy="257" rx="12" ry="12" style="transform-origin: 185px 257px;"/>
      
      <!-- Right Eye -->
      <ellipse class="eye" cx="327" cy="257" rx="12" ry="12" style="transform-origin: 327px 257px;"/>
    </g>
  </g>
</svg>
