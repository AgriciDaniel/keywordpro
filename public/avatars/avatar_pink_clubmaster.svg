<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        93%, 97% { transform: scaleY(0.1); }
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-8px) rotate(-1deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(-5px) rotate(1deg); }
      }
      
      @keyframes eyebrowRaise {
        0%, 85%, 100% { transform: translateY(0); }
        88%, 92% { transform: translateY(-4px); }
      }
      
      @keyframes subtleGlow {
        0%, 100% { filter: drop-shadow(0 0 0px rgba(236, 72, 153, 0)); }
        50% { filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.3)); }
      }
      
      .eye {
        animation: blink 5s infinite;
      }
      
      .character {
        animation: bounce 3s ease-in-out infinite, subtleGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      
      .eyebrow {
        transform-origin: center;
        animation: eyebrowRaise 7s infinite;
      }
    </style>
  </defs>

  <!-- Character Group with bounce animation -->
  <g class="character">
    <!-- Main Head Circle -->
    <circle cx="256" cy="256" r="180" fill="#EC4899"/>
    
    <!-- Head Outline -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#3D3D3D" stroke-width="8"/>

    <!-- CLUBMASTER/BROWLINE STYLE GLASSES -->
    <g stroke="#3D3D3D" stroke-linecap="round">
      <!-- Left Lens - Top thick frame (browline) -->
      <path d="M 140 235 L 230 235" stroke-width="14" fill="none"/>
      
      <!-- Left Lens - Thin round bottom -->
      <path d="M 140 235 Q 135 265 150 285 Q 185 295 220 285 Q 235 265 230 235" stroke-width="4" fill="none"/>
      
      <!-- Right Lens - Top thick frame (browline) -->
      <path d="M 282 235 L 372 235" stroke-width="14" fill="none"/>
      
      <!-- Right Lens - Thin round bottom -->
      <path d="M 282 235 Q 277 265 292 285 Q 327 295 362 285 Q 377 265 372 235" stroke-width="4" fill="none"/>
      
      <!-- Bridge -->
      <line x1="230" y1="240" x2="282" y2="240" stroke-width="6"/>
      
      <!-- Left Temple Arm -->
      <path d="M 140 240 L 85 230" stroke-width="10"/>
      
      <!-- Right Temple Arm -->
      <path d="M 372 240 L 427 230" stroke-width="10"/>
    </g>

    <!-- EYEBROWS GROUP -->
    <g class="eyebrow" fill="none" stroke="#3D3D3D" stroke-width="6" stroke-linecap="round">
      <!-- Left Eyebrow -->
      <path d="M 145 200 Q 185 195 225 200"/>
      
      <!-- Right Eyebrow -->
      <path d="M 287 200 Q 327 195 367 200"/>
    </g>

    <!-- EYES GROUP -->
    <g fill="#3D3D3D">
      <!-- Left Eye -->
      <ellipse class="eye" cx="185" cy="260" rx="12" ry="12" style="transform-origin: 185px 260px;"/>
      
      <!-- Right Eye -->
      <ellipse class="eye" cx="327" cy="260" rx="12" ry="12" style="transform-origin: 327px 260px;"/>
    </g>
  </g>
</svg>
