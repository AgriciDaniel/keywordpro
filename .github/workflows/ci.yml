name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: keyword_pro
          POSTGRES_PASSWORD: keyword_pro # pragma: allowlist secret
          POSTGRES_USER: keyword_pro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyword_pro -d keyword_pro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://keyword_pro:keyword_pro@127.0.0.1:5432/keyword_pro # pragma: allowlist secret
      DATABASE_SSL_MODE: disable
      KEYWORD_PRO_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_PUBLIC_APP_URL: http://localhost:3002
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run release checks
        run: pnpm --ignore-workspace run ci
